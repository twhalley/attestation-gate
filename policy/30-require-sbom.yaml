# Policy 3 of 3: the image must carry an SPDX SBOM attestation, signed by the
# same workflow identity.
#
# Separate from the provenance policy for the same reason that one is separate
# from the signature policy: authorities inside a ClusterImagePolicy are OR-ed,
# so anything that must be independently true needs its own policy object.
#
# What this buys, concretely: when the next Log4Shell lands, the question
# "which of our running images contain the affected package?" is answerable
# from signed attestations attached to the images themselves, rather than by
# rebuilding everything and hoping the rebuild resembles what is deployed.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: require-sbom
spec:
  images:
    - glob: "ghcr.io/twhalley/attestation-gate/**"

  mode: enforce

  authorities:
    - name: spdx-sbom
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: "https://token.actions.githubusercontent.com"
            subject: "https://github.com/twhalley/attestation-gate/.github/workflows/build-sign-attest.yml@refs/heads/main"
      ctlog:
        url: https://rekor.sigstore.dev
      attestations:
        - name: sbom-from-release-workflow
          # cosign `--type spdxjson` produces this predicate type.
          predicateType: https://spdx.dev/Document
          policy:
            type: cue
            # Asserts the predicate type and, via the authority above, the
            # signer. Deliberately says nothing about contents: a policy that
            # demanded specific packages would be a policy about this
            # application rather than about whether a trustworthy SBOM exists,
            # and it would break on the first dependency bump -- which is how
            # policies get switched off.
            #
            # It also avoids asserting the internal shape of cosign's SBOM
            # predicate, which differs between `--type spdx` and
            # `--type spdxjson`. The build workflow prints the real predicate
            # keys in its self-verification step if you need to tighten this.
            data: |
              predicateType: "https://spdx.dev/Document"
