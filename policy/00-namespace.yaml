# Two independent admission controls, deliberately layered.
#
#   policy.sigstore.dev/include  -- provenance: where did this image come from?
#   pod-security.kubernetes.io   -- posture:    what can it do once it is running?
#
# They answer different questions and neither substitutes for the other. A
# perfectly signed image still runs as root if nothing stops it, and a
# beautifully confined pod is still whatever an attacker managed to push.
#
# Enforcement is opt-in per namespace in both cases -- which is itself worth
# knowing: whoever can create a namespace, or edit these labels, can create an
# unenforced place to run things. See THREATMODEL.md, "Known gaps".
apiVersion: v1
kind: Namespace
metadata:
  name: gated
  labels:
    policy.sigstore.dev/include: "true"

    # Pod Security Admission, `restricted` profile: no privilege escalation,
    # non-root, all capabilities dropped, seccomp RuntimeDefault, no host
    # namespaces or hostPath.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # Audit and warn at the same level so a future relaxation of `enforce`
    # still leaves a trail rather than going quiet.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
