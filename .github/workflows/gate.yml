# Stage 3 of 3: the evidence artefact.
#
# Stands up a real kind cluster with sigstore policy-controller, applies the
# policies, and attempts to run all five image variants. The job summary of
# this workflow is the thing worth showing someone: four rejections, each with
# the webhook's own reason, and one admission that reaches Running.
name: gate

on:
  workflow_run:
    workflows: [untrusted-signer]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read # to download the build stage's digest artefacts

jobs:
  admission-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Used by test/run.sh to resolve tags to digests before deploying.
      - name: Install crane
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin crane
          crane version

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: attestation-gate
          wait: 120s

      - name: Install policy-controller and apply policies
        run: ./test/setup.sh
        env:
          CLUSTER: attestation-gate

      # Admission happens before any pull, so the reject cases pass without
      # this. The admit case does not: it asserts the pod actually reaches
      # Running, which needs the kubelet to fetch the image. Doing it with a
      # pull secret rather than by making the package public keeps the demo
      # self-contained and independent of repository settings.
      - name: Give the cluster credentials to pull from GHCR
        run: |
          set -euo pipefail
          # crane needs its own credentials to resolve tags to digests.
          crane auth login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

          kubectl -n gated create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n gated patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr"}]}'

      # Pin the test to the exact digests a completed build produced, rather
      # than resolving the tags now.
      #
      # Tags are mutable, and a push while this job is queued starts a rebuild
      # that moves them. Resolving `:trusted` mid-rebuild finds an image that
      # has been pushed but not yet attested, and the suite reports a failure
      # that says nothing about the policies -- the same class of false signal
      # as every other bug in this file's history, arriving by a new route.
      - name: Pin digests from the last successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/twhalley/attestation-gate/app
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence

          build_run=$(gh run list --workflow build-sign-attest.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          rogue_run=$(gh run list --workflow untrusted-signer.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')

          echo "build evidence from run ${build_run}, rogue from run ${rogue_run}"
          gh run download "$build_run" --name build-evidence --dir /tmp/evidence
          gh run download "$rogue_run" --name rogue-digest   --dir /tmp/evidence

          # shellcheck disable=SC1091
          . /tmp/evidence/digests.env
          . /tmp/evidence/rogue.env

          {
            echo "TRUSTED_REF=${IMAGE}@${TRUSTED_DIGEST}"
            echo "UNSIGNED_REF=${IMAGE}@${UNSIGNED_DIGEST}"
            echo "NOPROV_REF=${IMAGE}@${NOPROV_DIGEST}"
            echo "NOSBOM_REF=${IMAGE}@${NOSBOM_DIGEST}"
            echo "KEYSIGNED_REF=${IMAGE}@${KEYSIGNED_DIGEST}"
            echo "ROGUE_REF=${IMAGE}@${ROGUE_DIGEST}"
          } >> "$GITHUB_ENV"

      - name: Run admission test suite
        run: ./test/run.sh

      - name: Dump policy-controller logs on failure
        if: failure()
        run: |
          kubectl -n cosign-system logs -l app.kubernetes.io/name=policy-controller --tail=200 || true
          kubectl get clusterimagepolicy -o yaml || true
