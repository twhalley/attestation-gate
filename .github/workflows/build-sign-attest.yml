# Stage 1 of 3.
#
# Builds five image variants that differ ONLY in their signing/attestation
# state, so the admission gate in stage 3 has something to accept and several
# things to reject. Each variant carries a distinct `variant` label, which
# gives it a distinct digest -- signatures attach to digests, so variants that
# shared a digest would share signatures and every test would pass vacuously.
#
# Built with Podman/Buildah rather than the Docker daemon: rootless and
# daemonless, so no step in this job holds a socket equivalent to host root.
# For a pipeline whose entire output is a trust claim, the build tool having
# less authority is the point.
name: build-sign-attest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/twhalley/attestation-gate/app
  BASELINE_IMAGE: ghcr.io/twhalley/attestation-gate/baseline

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless signing (OIDC token from Actions)

    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v3

      - name: Ensure podman is available
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          fi
          podman version

      - name: Log in to ghcr.io
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      # Each variant is byte-identical except for the `variant` label, which is
      # exactly enough to give it its own digest and therefore its own
      # signature namespace.
      - name: Build and push all variants
        id: build
        run: |
          set -euo pipefail

          build_push() {
            local variant="$1" containerfile="$2" context="$3" image="$4"
            podman build \
              --label "variant=${variant}" \
              --build-arg "VERSION=${GITHUB_SHA}" \
              --build-arg "VARIANT=${variant}" \
              -f "$containerfile" \
              -t "${image}:${variant}" \
              "$context"
            podman push "${image}:${variant}" --digestfile "/tmp/${variant}.digest"
            local digest
            digest="$(cat "/tmp/${variant}.digest")"
            echo "${variant}=${digest}" >> "$GITHUB_OUTPUT"
            echo "built ${image}:${variant} -> ${digest}"
          }

          build_push trusted       app/Dockerfile "$PWD/app" "$IMAGE"
          build_push unsigned      app/Dockerfile "$PWD/app" "$IMAGE"
          build_push no-provenance app/Dockerfile "$PWD/app" "$IMAGE"
          build_push keysigned     app/Dockerfile "$PWD/app" "$IMAGE"

          # The "before" artefact. Published so the scan-diff numbers are
          # reproducible by anyone, and so the VEX demo has a registry digest
          # to pin a statement to. Deliberately unsigned: it is the thing being
          # migrated away from, and the gate rejects it like anything else.
          build_push baseline baseline/Dockerfile "$PWD" "$BASELINE_IMAGE"

      - name: Sign trusted + no-provenance variants (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.trusted }}"
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs['no-provenance'] }}"

      - name: Generate SLSA provenance predicate
        run: |
          set -euo pipefail
          cat > provenance.json <<EOF
          {
            "builder": {
              "id": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-sign-attest.yml@${GITHUB_REF}"
            },
            "buildType": "https://github.com/${GITHUB_REPOSITORY}/build@v1",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF}",
                "digest": { "sha1": "${GITHUB_SHA}" },
                "entryPoint": ".github/workflows/build-sign-attest.yml"
              },
              "environment": {
                "github_run_id": "${GITHUB_RUN_ID}",
                "github_run_attempt": "${GITHUB_RUN_ATTEMPT}"
              }
            },
            "metadata": {
              "buildInvocationId": "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
              "completeness": {
                "parameters": true,
                "environment": false,
                "materials": false
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${GITHUB_REPOSITORY}",
                "digest": { "sha1": "${GITHUB_SHA}" }
              }
            ]
          }
          EOF
          cat provenance.json

      - name: Attest trusted variant only
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type slsaprovenance \
            --predicate provenance.json \
            "${IMAGE}@${{ steps.build.outputs.trusted }}"

      # A signature that is valid but was never written to the transparency
      # log. Demonstrates why the ctlog requirement in the policy matters:
      # without it, an attacker who obtains signing capability can sign
      # silently and leave no public record.
      - name: Sign keysigned variant with a local key, no transparency log
        env:
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          cosign generate-key-pair
          cosign sign --yes \
            --key cosign.key \
            --tlog-upload=false \
            "${IMAGE}@${{ steps.build.outputs.keysigned }}"

      - name: Record digests for downstream stages
        run: |
          set -euo pipefail
          cat > digests.env <<EOF
          TRUSTED_DIGEST=${{ steps.build.outputs.trusted }}
          UNSIGNED_DIGEST=${{ steps.build.outputs.unsigned }}
          NOPROV_DIGEST=${{ steps.build.outputs['no-provenance'] }}
          KEYSIGNED_DIGEST=${{ steps.build.outputs.keysigned }}
          BASELINE_DIGEST=${{ steps.build.outputs.baseline }}
          EOF
          cat digests.env

      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: digests.env
          retention-days: 7
