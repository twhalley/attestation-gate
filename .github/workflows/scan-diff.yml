# The quantitative claim, regenerated on every change rather than written once
# into a README and left to rot.
name: scan-diff

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, because the interesting number is not today's CVE count but how
    # the baseline drifts upward while the hardened image does not.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # Installed from the vendors' own install scripts rather than via the
      # wrapper actions: download-grype does not reliably leave grype on PATH
      # for later `run:` steps, and the failure surfaces as "missing required
      # tool: grype" several steps later.
      - name: Install syft and grype
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sudo sh -s -- -b /usr/local/bin
          curl -fsSL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft --version && grype --version

      - name: Build and compare CVE surface
        run: ./scripts/scan-diff.sh

      # Answers "is the hardening already done for me?" with readelf rather
      # than opinion. Cheap, and it runs on the same two images just built.
      - name: Compare binary hardening
        run: ./scripts/hardening-diff.sh

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.scan/report.md', 'utf8');
            const marker = '<!-- scan-diff -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const existing = (await github.rest.issues.listComments({
              owner, repo, issue_number,
            })).data.find(c => c.body.includes(marker));

            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: payload,
              });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-results
          path: .scan/
          retention-days: 14
